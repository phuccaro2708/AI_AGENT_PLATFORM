name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript (lint, typecheck, test, build)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  tauri:
    name: Tauri shell (Rust check + test, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch, 2026-10-16)
      # The sidecar tests spawn a tiny `node -e` stand-in, so Node must be the pinned version.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  security:
    name: Security (secret scan, pnpm audit, cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # secret scan walks every commit
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (fail on high or critical)
        run: pnpm audit --audit-level=high
      - name: pnpm audit report (all severities, informational)
        run: pnpm audit --audit-level=low || true
      - name: Secret scan (detect-secrets, worktree + all commits)
        run: | # pragma: allowlist secret (false positive: package name 'detect-secrets==1.5.0')
          python3 -m pip install detect-secrets==1.5.0
          python3 scripts/secret-scan.py
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  desktop-smoke:
    name: Windows desktop + Node sidecar spike (ADR-001)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (branch, 2026-10-16)
      - run: pnpm install --frozen-lockfile
      - name: Build self-contained sidecar bundle
        run: node scripts/build-sidecar.mjs
      - name: Sidecar spike (startup, IPC, StubAdapter, SQLite, cleanup)
        run: node scripts/sidecar-spike.mjs
        env:
          SPIKE_REPORT: ${{ runner.temp }}\spike-report.json
      - name: Build Tauri app (no installer)
        run: pnpm --filter @agent-studio/desktop tauri build --no-bundle
      - name: agent-job-wrap sits next to the app exe (P4-4 (b) packaging)
        shell: pwsh
        run: |
          $dir = Split-Path (Resolve-Path "apps/desktop/src-tauri/target/release/agent-studio.exe").Path
          $w = Join-Path $dir "agent-job-wrap.exe"
          if (-not (Test-Path $w)) { throw "agent-job-wrap.exe missing next to agent-studio.exe" }
          & $w -- cmd /c echo wrapped-ok
          if ($LASTEXITCODE -ne 0) { throw "agent-job-wrap smoke exited $LASTEXITCODE" }
      - name: Launch the real app in selftest mode
        shell: pwsh
        run: |
          $exe = (Resolve-Path "apps/desktop/src-tauri/target/release/agent-studio.exe").Path
          Copy-Item -Recurse "services/orchestrator/sidecar-dist" (Join-Path (Split-Path $exe) "sidecar")
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $env:AGENT_STUDIO_SELFTEST_OUT = $out
          $env:AGENT_STUDIO_DB = Join-Path $env:RUNNER_TEMP "selftest.db"
          $p = Start-Process -FilePath $exe -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) {
            $p.Kill()
            throw "App did not exit within 120s: selftest did not complete"
          }
          if (-not (Test-Path $out)) { throw "No selftest report written (exit code $($p.ExitCode))" }
          Get-Content $out
          $r = Get-Content $out -Raw | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or -not $r.ok) { throw "Selftest failed (exit code $($p.ExitCode))" }
          Start-Sleep -Seconds 2
          if (Get-Process -Id $r.stub.sidecarPid -ErrorAction SilentlyContinue) { throw "Sidecar pid $($r.stub.sidecarPid) still alive after app exit" }
          Write-Host "sidecar pid $($r.stub.sidecarPid) is gone after app exit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: desktop-smoke-evidence
          path: |
            ${{ runner.temp }}/spike-report.json
            ${{ runner.temp }}/selftest.json
          if-no-files-found: warn
