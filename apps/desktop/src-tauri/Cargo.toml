[package]
name = "agent-studio"
version = "0.0.0"
description = "Agent Studio desktop shell"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "agent_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
